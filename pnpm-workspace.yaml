packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

# Ces deux avis ne proposent aucune version amont corrigée. Leur correctif est
# rétroporté et verrouillé ci-dessus ; l'audit peut donc ignorer les identifiants
# de version tout en continuant à bloquer toute autre vulnérabilité élevée.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
